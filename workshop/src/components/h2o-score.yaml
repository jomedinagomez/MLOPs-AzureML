$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: h2o_binary_score
display_name: Score H2O Binary Model
type: command
description: Validate, score, reconcile, and emit aggregate telemetry for an H2O binary model.
inputs:
  model_dir:
    type: custom_model
  input_data:
    type: uri_file
  correlation_id:
    type: string
  id_column:
    type: string
    default: __generated__
  fail_on_rejects:
    type: boolean
    default: false
  h2o_nthreads:
    type: integer
    min: 1
    default: 3
  h2o_max_mem_size:
    type: string
    default: 6G
outputs:
  scored_output:
    type: uri_folder
  monitoring_output:
    type: uri_folder
code: ../h2o/batch
environment: azureml:workshop-h2o-binary-environment:1
command: >-
  python score.py
  --model-dir ${{inputs.model_dir}}
  --input-data ${{inputs.input_data}}
  --scored-output ${{outputs.scored_output}}
  --monitoring-output ${{outputs.monitoring_output}}
  --correlation-id '${{inputs.correlation_id}}'
  --id-column '${{inputs.id_column}}'
  --fail-on-rejects ${{inputs.fail_on_rejects}}
  --h2o-nthreads ${{inputs.h2o_nthreads}}
  --h2o-max-mem-size '${{inputs.h2o_max_mem_size}}'