$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
experiment_name: workshop-h2o-scoring
description: CMK-compatible offline scoring for a validated H2O binary-model bundle.

inputs:
  model_dir:
    type: custom_model
    path: azureml:workshop-h2o-binary:1
  input_data:
    type: uri_file
    path: ../data/h2o/reference_bundle/golden_input.csv
  correlation_id: workshop-manual-run
  id_column: __generated__
  fail_on_rejects: false
  h2o_nthreads: 3
  h2o_max_mem_size: 6G

outputs:
  scored_output:
    mode: rw_mount
  monitoring_output:
    mode: rw_mount

settings:
  # The submission notebook replaces these values from workshop/.env.
  default_compute: azureml:workshop-compute
  default_datastore: azureml:workspaceblobstore
  continue_on_step_failure: false
  force_rerun: true

jobs:
  score:
    type: command
    component: ../src/components/h2o-score.yaml
    inputs:
      model_dir: ${{parent.inputs.model_dir}}
      input_data: ${{parent.inputs.input_data}}
      correlation_id: ${{parent.inputs.correlation_id}}
      id_column: ${{parent.inputs.id_column}}
      fail_on_rejects: ${{parent.inputs.fail_on_rejects}}
      h2o_nthreads: ${{parent.inputs.h2o_nthreads}}
      h2o_max_mem_size: ${{parent.inputs.h2o_max_mem_size}}
    outputs:
      scored_output: ${{parent.outputs.scored_output}}
      monitoring_output: ${{parent.outputs.monitoring_output}}