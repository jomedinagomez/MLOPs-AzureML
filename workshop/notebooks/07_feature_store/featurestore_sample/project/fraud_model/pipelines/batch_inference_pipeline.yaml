# This is a pipeline is for illustration purpose only. Do not use it for production use.
description: batch inference pipeline
display_name: batch_inference
experiment_name: batch inference on fraud model
type: pipeline

inputs:
  input_model:
    mode: ro_mount
    path: azureml:fraud_model:1
    type: custom_model
  observation_data:
    mode: ro_mount
    path: abfss://spark@stpublicdlncus04.dfs.core.windows.net/feature-store-prp/observation_data/batch_inference/
    type: uri_folder
  timestamp_column: timestamp

jobs:

  retrieval_step:
    component: azureml://registries/azureml/components/feature_retrieval/versions/1.1.1
    inputs:
      input_model:
        path: ${{parent.inputs.input_model}}
      observation_data:
        path: ${{parent.inputs.observation_data}}
      timestamp_column: ${{parent.inputs.timestamp_column}}
      observation_data_format: parquet
    resources:
      instance_type: standard_e4s_v3
      runtime_version: "3.5"
    outputs:
      output_data:
        type: uri_folder
        mode: direct
        # The workspace default storage has blob soft delete, which Spark's ADLS Gen2 driver can't write to.
        path: azureml://datastores/featurestore_adls/paths/feature-store-prp/pipeline-outputs/${{name}}/output_data/
    conf:
      spark.driver.cores: 4
      spark.driver.memory: 28g
      spark.executor.cores: 4
      spark.executor.memory: 28g
      spark.executor.instances: 2
      # Override the component's azureml-featurestore~=1.1.1, which can't parse current feature set metadata (schema_version).
      spark.synapse.library.python.env: |
        dependencies:
          - python=3.8
          - pip:
            - protobuf==3.19.6
            - azureml-featurestore==1.2.2
        name: fs_env
    type: spark
  
  inference_step:
    type: command
    compute: azureml:cpu-cluster-fs
    code: ../batch_inference/src
    environment:
      image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04
      conda_file: ../../env/conda.yml
    inputs:
      model_input:
        path: ${{parent.inputs.input_model}}
      inference_data:
        path: ${{parent.jobs.retrieval_step.outputs.output_data}}
    outputs:
      data_with_prediction:
        type: uri_folder
    command: >-
      python batch_inference.py
      --inference_data ${{inputs.inference_data}}
      --model_input ${{inputs.model_input}}
      --output_data ${{outputs.data_with_prediction}}